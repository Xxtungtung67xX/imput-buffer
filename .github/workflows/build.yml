name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64

      - name: Upload mod file
        uses: actions/upload-artifact@v4
        with:
          name: mod-geode
          path: build/*.geode
          if-no-files-found: warn
